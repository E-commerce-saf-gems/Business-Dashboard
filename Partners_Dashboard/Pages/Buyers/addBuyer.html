<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Buyer</title>
    <link rel="stylesheet" href="../../../Components/Partner_Dashboard_Template/styles.css">
    <link rel="stylesheet" href="./salesStyles.css">
</head>
<body>
    <dashboard-component></dashboard-component>

    <section id="content">
        <main>
            <div class="head-title">
                <div class="left">
                    <h1>Add New Buyer</h1>
                    <ul class="breadcrumb">
                        <li><a class="active" href="./buyers.php">Back to Buyers</a></li>
                    </ul>
                </div>
            </div>

            <div class="form-container">
                <form action="addBuyers.php" method="POST" class="buyer-form">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="address">Address:</label>
                    <input type="text" id="address" name="address" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="contact_no">Contact No:</label>
                    <input type="text" id="contact_no" name="contact_no" required>

                    <button type="submit" class="btn-add">Add Buyer</button>
                </form>
            </div>
        </main>
    </section>

    <script src="../../../Components/Partner_Dashboard_Template/script.js"></script>
</body>
</html>
