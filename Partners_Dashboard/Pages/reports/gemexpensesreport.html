<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gem Expenses Report</title>
  <link rel="stylesheet" href="../../../Components/Accountant_Dashboard_Template/styles.css" />
  <link rel="stylesheet" href="./reports.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>
<body>
  <dashboard-component></dashboard-component>

  <section id="content">
    <main>
      <div class="head-title">
        <div class="left">
          <h1>Reports</h1>
          <ul class="breadcrumb">
            <li><a class="active" href="./reports.html">Home</a></li>
            <li><i class="bx bx-chevron-right"></i></li>
            <li><a class="active" href="#">Gem Expenses Report</a></li>
          </ul>
        </div>
      </div>

      <div id="gemExpensesForm" class="report-form">
        <h2>Gem Expenses Report</h2>

        <!-- Gem Selection -->
        <label for="stone_id">Select Gem:</label>
        <select id="stone_id">
          <option value="" disabled selected>Loading gems...</option>
        </select>
        <button onclick="selectGemExpensesData()">Select Gem</button>

        <!-- Gem Details -->
        <div id="gemDetails" >
          <h3>Gem Details</h3>
          <p><strong>ID:</strong> <span id="gemId"></span></p>
          <p><strong>Type:</strong> <span id="gemType"></span></p>
          <p><strong>Availability:</strong> <span id="gemAvailability"></span></p>
          <p><strong>Visibility:</strong> <span id="gemVisibility"></span></p>
        </div>

        <!-- Expense Fields -->
        <div id="expenseFields">
          <h3>Expense Details</h3>
          <label>Cutting & Polishing:
            <input type="number" id="cuttingPolishing" step="0.01" readonly />
          </label>
          <label>Certifications:
            <input type="number" id="certificationFees" step="0.01" readonly />
          </label>
          <label>Marketing:
            <input type="number" id="marketing" step="0.01" readonly />
          </label>
          <label>Logistics:
            <input type="number" id="logistics" step="0.01" readonly />
          </label>
          <label>Other Expenses:
            <input type="number" id="otherExpenses" step="0.01" readonly />
          </label>

          <label><strong>Total Operational Cost:</strong>
            <input type="number" id="totalCost" readonly />
          </label>

          <br /><br />
          <button onclick="generateGemExpensesReport()">Generate Report</button>

        </div>
      </div>
    </main>
  </section>

  <script src="../../../Components/Accountant_Dashboard_Template/script.js"></script>
  <script src="./gemexpensesreport.js"></script>
</body>
</html>
