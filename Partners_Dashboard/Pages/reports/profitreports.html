<!-- profitreport.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit & Loss Report</title>
    <link rel="stylesheet" href="../../../Components/Partner_Dashboard_Template/styles.css">
    <link rel="stylesheet" href="./reports.css">   
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <dashboard-component></dashboard-component>

    <section id="content">
        <main>
            <div class="head-title">
                <div class="left">
                  <h1>Reports</h1>
                  <ul class="breadcrumb">
                    <li><a class="active" href="./reports.html">Home</a></li>
                    <li><i class='bx bx-chevron-right'></i></li>
                    <li><a class="active" href="#">Generate Report</a></li>
                  </ul>
                </div>
              </div>

            <!-- Report Boxes Section -->
            <div id="profitLossForm" class="report-form">
                <h2>Profit and Loss Report</h2>
                <label>Date Range:
                    <input type="date" id="plStartDate"> to 
                    <input type="date" id="plEndDate">
                </label>
                <button id="selectDateBtn">Select Date</button>
        
                <h3>Revenue</h3>
                <label>Total Sales Revenue: <input type="number" id="totalSalesRevenue" step="0.01" readonly></label>
                <label>Other Income: <input type="number" id="otherIncome" step="0.01"></label>
        
                <h3>Cost of Goods Sold (COGS)</h3>
                <label>Purchases: <input type="number" id="purchases" step="0.01" readonly></label>
        
                <h3>Operating Expenses</h3>
                <label>Cutting and Polishing: <input type="number" id="cuttingPolishing" step="0.01" readonly></label>
                <label>Certification Fees: <input type="number" id="certificationFees" step="0.01" readonly></label>
                <label>Marketing: <input type="number" id="marketing" step="0.01" readonly></label>
                <label>Logistics: <input type="number" id="logistics" step="0.01" readonly></label>
                <label>Other Expenses: <input type="number" id="otherExpenses" step="0.01" readonly></label>
        
                <button id="generateReportBtn">Generate Profit & Loss Report</button>
            </div>
        </main>
    </section>

    <script src="../../../Components/Partner_Dashboard_Template/script.js"></script>
    <script src="./profitreport.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

</body>
</html>
