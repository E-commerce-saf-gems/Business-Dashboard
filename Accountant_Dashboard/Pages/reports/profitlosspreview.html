<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profit & Loss Report Preview</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px;
    }

    .report-container {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    

    .report-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .company-logo {
      width: 100px;
      margin: 0 auto;
      display: block;
    }

    .company-name {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0 5px;
    }

    .report-title {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }

    .report-meta {
      margin-bottom: 20px;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .report-table td,
    .report-table th {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }

    .section-header {
      background-color: rgb(206, 254, 254);
      font-weight: bold;
      text-align: center;
    }

    .section-total {
      background-color: #d4edda;
      font-weight: bold;
    }

    .footer-note {
      margin-top: 30px;
      font-size: 13px;
      color: #6c757d;
      text-align: center;
    }

    .signature-block {
      margin-top: 60px;
      text-align: center;
    }

    .signature-line {
      margin-top: 30px;
      border-top: 2px dotted #333;
      width: 250px;
      margin-left: auto;
      margin-right: auto;
    }

    .signature-label {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
    }

    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 40px auto 0;
    }

    .action-buttons button {
      padding: 10px 18px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .print-btn {
      background-color: #007bff;
      color: white;
    }

    .pdf-btn {
      background-color: #28a745;
      color: white;
    }

    .back-btn {
      background-color: #6c757d;
      color: white;
    }
  </style>
</head>
<body>

  <div id="reportTemplate"></div>

  <script>
    function downloadPDF() {
      const reportElement = document.getElementById("reportTemplate");
      const opt = {
        margin: 0.5,
        filename: 'Profit_Loss_Report.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(reportElement).save();
    }

    document.addEventListener("DOMContentLoaded", function () {
      const reportType = localStorage.getItem("reportType");
      const reportTemplate = document.getElementById("reportTemplate");

      if (reportType === "profit-loss") {
        const data = JSON.parse(localStorage.getItem("profitLossReportData"));

        if (!data) {
          reportTemplate.innerHTML = `<p>No report data found.</p>`;
          return;
        }

        reportTemplate.innerHTML = `
          <div class="report-container" id="reportContent">
            <div class="report-header">
                <img src="/images/logo.png" alt="Company Logo" class="company-logo">
                <p class="company-name">SAF Gems</p>
                <h3 class="report-title">Profit & Loss Report</h3>
            </div>

            <div class="report-meta">
                <p><strong>Prepared by:</strong> Accountant </p>
                <p><strong>Period:</strong> ${data.dateRange}</p>
                <p><em>Financial statements in Sri Lankan Rupees (Rs.)</em></p>
            </div>


            <table class="report-table">
              <tr class="section-header"><th colspan="2">REVENUE</th></tr>
              <tr><td>Total Sales Revenue</td><td>Rs. ${data.totalSalesRevenue.toFixed(2)}</td></tr>
              <tr><td>Other Income</td><td>Rs. ${data.otherIncome.toFixed(2)}</td></tr>
              <tr class="section-total"><td>Total Revenue</td><td>Rs. ${(data.totalSalesRevenue + data.otherIncome).toFixed(2)}</td></tr>

              <tr class="section-header"><th colspan="2">COST OF GOODS SOLD</th></tr>
              <tr><td>Purchases</td><td>Rs. ${data.purchases.toFixed(2)}</td></tr>
              <tr class="section-total"><td>Total COGS</td><td>Rs. ${data.purchases.toFixed(2)}</td></tr>

              <tr class="section-header"><th colspan="2">EXPENSES</th></tr>
              <tr><td>Salaries & Wages</td><td>Rs. ${data.cuttingPolishing.toFixed(2)}</td></tr>
              <tr><td>Rent & Utilities</td><td>Rs. ${data.certificationFees.toFixed(2)}</td></tr>
              <tr><td>Marketing & Advertising</td><td>Rs. ${data.marketing.toFixed(2)}</td></tr>
              <tr><td>Administrative Expenses</td><td>Rs. ${data.logistics.toFixed(2)}</td></tr>
              <tr><td>Other Expenses</td><td>Rs. ${data.otherExpenses.toFixed(2)}</td></tr>
              <tr class="section-total"><td>Total Expenses</td><td>Rs. ${data.totalExpenses.toFixed(2)}</td></tr>

              <tr class="section-header"><th colspan="2">PROFIT</th></tr>
              <tr><td>Gross Profit</td><td>Rs. ${data.grossProfit.toFixed(2)}</td></tr>
              <tr><td>Net Profit</td><td>Rs. ${data.netProfit.toFixed(2)}</td></tr>
            </table>

            <div class="signature-block">
              <div class="signature-line"></div>
              <div class="signature-label">Authorized Signature</div>
            </div>

            <div class="action-buttons">
              <button class="back-btn" onclick="window.location.href='profitreports.html'">← Back to Form</button>
              <button class="print-btn" onclick="window.print()">🖨️ Print</button>
              <button class="pdf-btn" onclick="downloadPDF()">⬇️ Download PDF</button>
            </div>

            <div class="footer-note">
              <p>Report generated on ${new Date().toLocaleDateString()}</p>
            </div>
          </div>
        `;
      } else {
        reportTemplate.innerHTML = `<p>No report type selected.</p>`;
      }
    });
  </script>

</body>
</html>
