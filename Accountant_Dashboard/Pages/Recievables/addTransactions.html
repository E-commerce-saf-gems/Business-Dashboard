<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Transaction</title>
    <link rel="stylesheet" href="../../../Components/Accountant_Dashboard_Template/styles.css">
    <link rel="stylesheet" href="../transactions/edittransactionstyles.css">   
    <link rel="stylesheet" href="../transactions/styles.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <dashboard-component></dashboard-component>
    <section id="content">
        <main>
            <div class="head-title">
				<div class="left">
					<h1>Add Invoice</h1>
					<ul class="breadcrumb">
						<li>
							<a href="../transactions/transactions.php">Home</a>
						</li>
						<li><i class='bx bx-chevron-right' ></i></li>
						<li>
							<a class="active" href="#">Add New Payment Receival</a>
						</li>
					</ul>
				</div>
			</div>
            
            <div class="edit-sales-container">
                <form class="edit-sales-form" id="editsalesform" action="./addTransactions.php" method="post">
                    <h2>New Payment Receival</h2><br>
                    <div class="form-group">
                        <label for="customerEmail">Customer Email</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="email" id="customer-email" name="email" placeholder="Enter Customer Email" required>
                            <button type="button" id="select-customer" class="btn-save" style="padding: 5px 15px;">
                                Select
                            </button>
                        </div>
                    </div>

                    <!-- Add this hidden field in your form -->
                    <input type="hidden" id="customer_id" name="customer_id">
                
                    <div class="form-group">
                        <label for="customerName">Customer Name</label>
                        <input type="text" id="customer-name" name="customer_name" disabled>
                    </div>
                
                    <div class="form-group">
                        <label for="customerNIC">NIC No</label>
                        <input type="text" id="nic" name="customer_nic" disabled>
                    </div>
                    
                    <div class="form-group">
                        <label for="stone">Purchased Stones</label>
                        <select id="stone" name="stone_id" required>
                            <option value="">Select a Stone</option>
                        </select>
                        
                    </div>
    
                    <div class="form-group">
                        <label for="amount">Amount (Rs.)</label>
                        <input type="number" id="amount" name="amount" placeholder="Enter Amount" min="0" step="1000" required>
                    </div>
                    
                    
                    <div class="form-actions">
                        <button type="submit" class="btn-save"><i class='bx bx-save'></i> Save</button>
                    </div>
                </form>
            </div>
        </main>
    </section>

    <script>
    document.getElementById('select-customer').addEventListener('click', function () {
        const emailInput = document.getElementById('customer-email');
        const emailValue = emailInput.value.trim();
    
        // Simple email regex
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    
        if (!emailPattern.test(emailValue)) {
            alert('Please enter a valid email address.');
            emailInput.focus();
        } else {
            // continue your "Select" button functionality here
            console.log('Valid email. Proceed...');
        }
    });
    </script>

    <script src="../../../Components/Accountant_Dashboard_Template/script.js"></script>
    <script src="./script.js"></script>
</body>
</html>
