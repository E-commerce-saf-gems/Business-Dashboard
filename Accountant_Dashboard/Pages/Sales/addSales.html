<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Sale</title>
    <link rel="stylesheet" href="../../../Components/Partner_Dashboard_Template/styles.css">
    <link rel="stylesheet" href="./editSalesStyles.css">   
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <dashboard-component></dashboard-component>
    <section id="content">
        <main>
            <div class="head-title">
                <div class="left">
                    <h1>Add Sale</h1>
                    <ul class="breadcrumb">
                        <li><a href="./sales.php">Sales Summary</a></li>
                        <li><i class='bx bx-chevron-right' ></i></li>
                        <li><a class="active" href="#">Add Sale</a></li>
                    </ul>
                </div>
            </div>

            <div class="edit-sales-container">
                <form class="edit-sales-form" id="editsalesform" action="./addSales.php" method="post">
                    <h2>New Sales Details</h2>

                    <!-- Date -->
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="datetime-local" id="date" name="date" required>
                    </div>

                    <!-- Stone ID -->
                    <div class="form-group">
                        <label for="stone_id">Stone ID</label>
                        <input type="number" id="stone_id" name="stone_id" required>
                    </div>

                    <!-- Customer ID -->
                    <div class="form-group">
                        <label for="customer_id">Customer ID</label>
                        <input type="number" id="customer_id" name="customer_id" required>
                    </div>

                    <!-- Total Amount -->
                    <div class="form-group">
                        <label for="total">Total Amount (Rs.)</label>
                        <input type="number" id="total" name="total" required>
                    </div>

                    <!-- Status -->
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status" required>
                            <option value="Paid">Paid</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>

                    <!-- Amount Settled (auto or manual) -->
                    <div class="form-group">
                        <label for="amountSettled">Amount Settled (Rs.)</label>
                        <input type="number" id="amountSettled" name="amountSettled" required>
                    </div>

                    <!-- Submit -->
                    <div class="form-actions">
                        <button type="submit" class="btn-save">
                            <i class='bx bx-save'></i> Save
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </section>
    <script src="../../../Components/Partner_Dashboard_Template/script.js"></script>
    <script src="./sales.js"></script>
</body>
</html>
