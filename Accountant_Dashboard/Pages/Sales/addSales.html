<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Sale</title>
    <link rel="stylesheet" href="../../../Components/Partner_Dashboard_Template/styles.css">
    <link rel="stylesheet" href="./editSalesStyles.css">   
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <dashboard-component></dashboard-component>
    <section id="content">
        <main>
            <div class="head-title">
                <div class="left">
                    <h1>Add Sale</h1>
                    <ul class="breadcrumb">
                        <li><a href="./sales.php">Sales Summary</a></li>
                        <li><i class='bx bx-chevron-right' ></i></li>
                        <li><a class="active" href="#">Add Sale</a></li>
                    </ul>
                </div>
            </div>

            <div class="edit-sales-container">
                <form class="edit-sales-form" id="editsalesform" action="./addSales.php" method="post">
                    <h2>New Sales Details</h2>

                    <div class="form-group">
                        <label for="email">Customer Email</label>
                        <select id="email" name="email" required>
                            <option value="">Select a Customer Email</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="stone">Sale Stones</label>
                        <select id="stone" name="stone_id" required>
                            <option value="">Select a Stone</option>
                        </select>
                    </div>
    
                    <div class="form-group">
                        <label for="amount">Amount (Rs.)</label>
                        <input type="number" id="amount" name="amount" placeholder="Enter Amount" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount to be Settled(Rs.)</label>
                        <input type="number" id="amountSettled" name="amountSettled" placeholder="Enter Amount" min="10000" required>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn-save"><i class='bx bx-save'></i> Save</button>
                    </div>
                </form>
            </div>
        </main>
    </section>
    <script src="../../../Components/Partner_Dashboard_Template/script.js"></script>
    <script src="./sales.js"></script>
</body>
</html>
